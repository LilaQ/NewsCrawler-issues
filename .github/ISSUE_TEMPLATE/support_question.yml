name: Support question
description: Ask for help using NewsBar without sharing sensitive data
title: "[Support] "
labels: [support]
body:
  - type: markdown
    attributes:
      value: Do not include personal information, credentials, receipts, private feed URLs, or sensitive logs.
  - type: input
    id: version
    attributes:
      label: NewsBar version and build
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - News list or categories
        - Reader
        - Sources or custom feeds
        - Menu-bar ticker
        - Notifications
        - Premium or restore purchases
        - Settings or accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
